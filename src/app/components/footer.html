<footer class="footer">
  <div class="container">
    <div class="inner">
      <span class="copy">© {{ year }} {{ name }}</span>
      <nav class="links" aria-label="Social">
        @for (l of links; track l.label) {
          <a
            [href]="l.url"
            [attr.target]="l.external ? '_blank' : null"
            [attr.rel]="l.external ? 'noopener noreferrer' : null"
          >{{ l.label }}</a>
        }
        <button type="button" class="top" (click)="toTop()">Back to top ↑</button>
      </nav>
    </div>
  </div>
</footer>
