<section class="section" id="contact">
  <div class="container">
    <div class="card panel" reveal>
      
      <span class="eyebrow">Contact</span>
      <h2 class="h2 big">Let's build something<br /><span class="dim">remarkable.</span></h2>
      <p class="lead">{{ contact.subtitle }}</p>

      <div class="primary">
        <a class="btn btn-primary btn-lg" [href]="'mailto:' + contact.email">
          <app-icon name="mail" [size]="17" /> Say hello
        </a>
        <button type="button" class="email" (click)="copyEmail()" [attr.aria-label]="'Copy email address ' + contact.email">
          <span class="addr">{{ contact.email }}</span>
          <span class="copy" [class.done]="copied()">
            <app-icon [name]="copied() ? 'check' : 'copy'" [size]="15" />
          </span>
        </button>
        <span class="sr-only" aria-live="polite">{{ copied() ? 'Email copied' : '' }}</span>
      </div>

      <div class="secondary">
        <a class="link" [href]="tel"><app-icon name="phone" [size]="16" /> {{ contact.phone }}</a>
        @for (s of socials; track s.label) {
          <a class="link" [href]="s.url" target="_blank" rel="noopener noreferrer">
            <app-icon [name]="iconFor(s.label)" [size]="16" /> {{ s.label }}
          </a>
        }
      </div>
    </div>
  </div>
</section>
