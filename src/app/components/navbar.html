<nav class="navbar" [class.scrolled]="scrollY() > 20">
  <div class="nav-inner">
    <a class="logo" href="#" (click)="scrollTo('about'); $event.preventDefault()">
      <span class="logo-text">{{ heroName }}</span>
      <span class="logo-dot"></span>
    </a>

    <ul class="nav-links desktop">
      @for (s of navSections; track s.id) {
        <li>
          <a (click)="scrollTo(s.id); $event.preventDefault()" href="#">{{ s.label }}</a>
        </li>
      }
    </ul>

    <div class="nav-actions">
      <button
        class="theme-btn"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (themeService.isDark()) {
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        } @else {
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </button>

      <button
        class="hamburger"
        type="button"
        aria-label="Toggle menu"
        [class.open]="mobileOpen()"
        (click)="toggleMobile()"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <div class="mobile-menu" [class.open]="mobileOpen()">
    <ul class="nav-links mobile">
      @for (s of navSections; track s.id) {
        <li>
          <a (click)="scrollTo(s.id); $event.preventDefault()" href="#">{{ s.label }}</a>
        </li>
      }
    </ul>
  </div>
</nav>
