<div class="progress" [style.transform]="'scaleX(' + progress() + ')'" aria-hidden="true"></div>

<header class="nav-wrap" [class.scrolled]="scrolled()">
  <nav class="nav" aria-label="Primary">
    <a class="brand" href="#about" (click)="go('about', $event)" aria-label="Back to top">
      <span class="brand-mark">RC</span>
      <span class="brand-name">{{ name }}</span>
    </a>

    <ul class="links">
      @for (s of sections; track s.id) {
        <li>
          <a [href]="'#' + s.id" [class.active]="active() === s.id" (click)="go(s.id, $event)">
            {{ s.label }}
          </a>
        </li>
      }
    </ul>

    <div class="actions">
      <button type="button" class="kbd-btn" (click)="openPalette.emit()" aria-label="Open command palette">
        <app-icon name="search" [size]="15" />
        <span class="kbd-label">Search</span>
        <kbd>{{ isMac ? '⌘' : 'Ctrl' }} K</kbd>
      </button>

      <button
        type="button"
        class="icon-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        <span class="theme-swap" [class.dark]="theme.isDark()">
          <app-icon name="moon" [size]="17" />
          <app-icon name="sun" [size]="17" />
        </span>
      </button>

      <button
        type="button"
        class="icon-btn menu-btn"
        [attr.aria-expanded]="mobileOpen()"
        aria-controls="mobile-menu"
        aria-label="Toggle menu"
        (click)="mobileOpen.set(!mobileOpen())"
      >
        <app-icon [name]="mobileOpen() ? 'close' : 'menu'" [size]="18" />
      </button>
    </div>
  </nav>

  <div id="mobile-menu" class="mobile" [class.open]="mobileOpen()">
    @for (s of sections; track s.id; let i = $index) {
      <a
        [href]="'#' + s.id"
        [class.active]="active() === s.id"
        [style.transition-delay.ms]="mobileOpen() ? 40 * i : 0"
        (click)="go(s.id, $event)"
      >
        <span class="mono idx">0{{ i + 1 }}</span>{{ s.label }}
      </a>
    }
  </div>
</header>
