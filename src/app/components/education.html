<section class="section" id="education">
  <div class="container">
    <header class="section-head" reveal>
      <span class="eyebrow">Education</span>
      <h2 class="h2">Computer science, <span class="grad-text">AI & ML.</span></h2>
      <p class="lead">B.E. in Computer Science (AI & ML) with Honours in Blockchain Technology.</p>
    </header>

    <div class="grid">
      @for (e of items; track e.id; let i = $index) {
        <article class="card edu" [class.primary]="i < 2" spotlight reveal [revealDelay]="i * 70">
          <div class="top">
            <span class="logo"><img [src]="e.img" [alt]="" loading="lazy" (error)="logoError($event)" /></span>
            <span class="date mono">{{ e.date }}</span>
          </div>
          <h3 class="degree">{{ e.degree }}</h3>
          <p class="school">{{ e.school }}</p>
          <div class="bottom">
            <span class="grade">{{ e.grade }}</span>
            <span class="note">{{ e.desc }}</span>
          </div>
        </article>
      }
    </div>
  </div>
</section>
