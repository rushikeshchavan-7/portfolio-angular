<div class="backdrop" aria-hidden="true">
  <div class="backdrop-grid"></div>
  <div class="backdrop-aurora a1"></div>
  <div class="backdrop-aurora a2"></div>
  <div class="backdrop-noise"></div>
</div>

<a class="skip-link" href="#main">Skip to content</a>

<app-navbar (openPalette)="paletteOpen.set(true)" />

<main id="main">
  <app-hero />
  <app-capabilities />
  <app-experience />
  <app-projects (open)="openProject($event)" />
  <app-education />
  <app-certificates />
  <app-contact />
</main>

<app-footer />

@if (selectedProject(); as project) {
  <app-project-details [project]="project" (closed)="selectedProject.set(null)" />
}

<app-command-palette
  [open]="paletteOpen()"
  (openChange)="paletteOpen.set($event)"
  (openProject)="openProject($event)"
/>
